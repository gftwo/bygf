name: Build APK Android

on:
  workflow_dispatch:        # jalankan manual dari tab Actions
  push:
    tags: ['apk-*']         # atau beri tag, mis. apk-9.8

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Siapkan folder www
        run: npm run build:www

      - name: Buat proyek Android
        run: npx cap add android

      - name: Izin notifikasi & alarm tepat waktu
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p, encoding='utf-8').read()
          perms = ['android.permission.POST_NOTIFICATIONS', 'android.permission.SCHEDULE_EXACT_ALARM',
                   'android.permission.USE_EXACT_ALARM', 'android.permission.RECEIVE_BOOT_COMPLETED', 'android.permission.VIBRATE']
          add = ''.join(f'    <uses-permission android:name="{x}" />\n' for x in perms if x not in s)
          s = s.replace('<application', add + '    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          cat "$MANIFEST"

      - name: Ikon notifikasi (siluet putih)
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_icon_config_sample.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.64,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z"/>
          </vector>
          XML

      - name: Sinkronkan & bangun APK
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BYgf-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
